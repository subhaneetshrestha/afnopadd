# Quality gates for every pull request into main and every push to main, and the APK built from
# main. A pull request is ready to merge only when "Unit tests and Lint" and "Instrumented tests"
# both pass; main then gets the same checks again and, when they pass, a debug APK.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request replaces the run in progress; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Gradle downloads JDK 17 for compilation itself (kotlin.jvmToolchain(17)); this JDK runs Gradle.
  JAVA_VERSION: "25"
  # compileSdk 37 with compileSdkMinor 2 (app/build.gradle.kts).
  ANDROID_PLATFORM: "platforms;android-37.2"
  ANDROID_BUILD_TOOLS: "build-tools;36.0.0"

jobs:
  check:
    name: Unit tests and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v4

      - name: Install the Android platform the app compiles against
        run: sdkmanager "${{ env.ANDROID_PLATFORM }}" "${{ env.ANDROID_BUILD_TOOLS }}"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, Lint and debug build
        run: ./gradlew check assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  instrumented:
    name: Instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v4

      - name: Install the Android platform the app compiles against
        run: sdkmanager "${{ env.ANDROID_PLATFORM }}" "${{ env.ANDROID_BUILD_TOOLS }}"

      - uses: gradle/actions/setup-gradle@v6

      # Hardware acceleration for the emulator; without it an API 36 emulator does not boot in time.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its tests before the emulator starts
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      # The same device as the local test emulator: API 36, Pixel 7.
      - name: Run instrumented tests on an API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 3072M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: |
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 2147483647
            adb shell wm dismiss-keyguard
            ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14

  apk:
    name: Build APK
    # Only main publishes an APK, and only once every test has passed on it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, instrumented]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v4

      - name: Install the Android platform the app compiles against
        run: sdkmanager "${{ env.ANDROID_PLATFORM }}" "${{ env.ANDROID_BUILD_TOOLS }}"

      - uses: gradle/actions/setup-gradle@v6

      # A debug APK: signed with the build's debug key, so it installs on any device for testing.
      # Release signing needs a keystore held in repository secrets (Task 31), never in the repo.
      - name: Build the debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK after the commit
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/afnopadd-debug-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: afnopadd-debug-apk
          path: out/*.apk
          retention-days: 30
