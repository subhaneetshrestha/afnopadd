# Quality gates for every pull request into main and every push to main, and the APK built from
# main. A pull request is ready to merge only when "Unit tests and Lint" and "Instrumented tests"
# both pass; main then gets the same checks again and, when they pass, a debug APK published as a
# GitHub pre-release.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request replaces the run in progress; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Gradle downloads JDK 17 for compilation itself (kotlin.jvmToolchain(17)); this JDK runs Gradle.
  JAVA_VERSION: "25"
  # compileSdk 37 with compileSdkMinor 2 (app/build.gradle.kts).
  ANDROID_PLATFORM: "platforms;android-37.2"
  ANDROID_BUILD_TOOLS: "build-tools;36.0.0"
  # API 36 on a Pixel 7, as the local test emulator, but the plain AOSP image: the app needs no
  # Google services, and Play services' background work on google_apis cost the frame-drop perf
  # test its margin (80 of 1,520 frames, over the emulator's 5 %).
  EMULATOR_IMAGE: "system-images;android-36;default;x86_64"

jobs:
  check:
    name: Unit tests and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v4

      - name: Install the Android platform the app compiles against
        run: sdkmanager "${{ env.ANDROID_PLATFORM }}" "${{ env.ANDROID_BUILD_TOOLS }}"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, Lint and debug build
        run: ./gradlew check assembleDebug assembleDebugAndroidTest --stacktrace

      # On main the APK built here is the one published once every test has passed, so the
      # publishing job does not build it a second time.
      - name: Hand the debug APK to the publishing job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk-unverified
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

      - name: Keep the reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  instrumented-shard:
    name: Instrumented tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The suite is split across one emulator per shard, all running side by side; the runner
    # splits it from the matrix size, so adding a shard here is all it takes.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      # The emulator's userdata partition needs about 7.4 GB and a stock runner leaves under 6 GB
      # free, so drop preinstalled toolchains this build never uses (.NET, Haskell, Boost, CodeQL).
      # It runs in the background and only has to be done before the emulator starts.
      - name: Start freeing disk space for the emulator
        run: |
          nohup sh -c 'sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"; sudo docker image prune --all --force; touch /tmp/disk-freed' > /tmp/free-disk.log 2>&1 &

      # Hardware acceleration for the emulator; without it an API 36 emulator does not boot in time.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v4

      - name: Install the Android platform, the emulator and its system image
        run: sdkmanager "${{ env.ANDROID_PLATFORM }}" "${{ env.ANDROID_BUILD_TOOLS }}" emulator "${{ env.EMULATOR_IMAGE }}" > /dev/null

      # The emulator boots in the background while Gradle builds, instead of after it.
      - name: Start the emulator
        run: |
          echo no | avdmanager create avd --force -n test --package "${{ env.EMULATOR_IMAGE }}" --device pixel_7
          config=~/.android/avd/test.avd/config.ini
          for setting in hw.cpu.ncore=4 hw.ramSize=3072 disk.dataPartition.size=4096M; do
            sed -i "/^${setting%%=*}=/d" "$config"
            echo "$setting" >> "$config"
          done
          timeout 300 sh -c 'until [ -f /tmp/disk-freed ]; do sleep 1; done'
          df -h /
          nohup "$ANDROID_HOME/emulator/emulator" -avd test -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot > /tmp/emulator.log 2>&1 &

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the app and its tests while the emulator boots
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      # A freshly booted emulator's System UI can stall and raise an "isn't responding" dialog over
      # the app, which then receives none of the tests' injected touches; hide such dialogs and
      # close any already open.
      - name: Wait for the emulator and prepare it for tests
        run: |
          adb wait-for-device
          timeout 300 sh -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done' || { cat /tmp/emulator.log; exit 1; }
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put global hide_error_dialogs 1
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
          adb shell svc power stayon true
          adb shell settings put system screen_off_timeout 2147483647
          adb shell wm dismiss-keyguard

      # Timing checks get four times the phone budget here instead of the local emulator's two: the
      # shared runners measured a 50 ms target at 123 ms where a local emulator takes 56 ms.
      - name: Run this shard of the instrumented tests
        run: >-
          ./gradlew connectedDebugAndroidTest --stacktrace
          -Pandroid.testInstrumentationRunnerArguments.perfBudgetScale=4
          -Pandroid.testInstrumentationRunnerArguments.numShards=${{ strategy.job-total }}
          -Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ strategy.job-index }}

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports-${{ matrix.shard }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            /tmp/emulator.log
          retention-days: 14

  # The single check branch protection requires: it passes only when every shard passed.
  instrumented:
    name: Instrumented tests
    if: always()
    needs: instrumented-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: test "${{ needs.instrumented-shard.result }}" = success

  apk:
    name: Build APK
    # Only main publishes an APK, and only once every test has passed on it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, instrumented]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Creating the tag and the release needs write access; every other job stays read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # A debug APK: signed with the build's debug key, so it installs on any device for testing.
      # Release signing needs a keystore held in repository secrets (Task 31), never in the repo.
      - uses: actions/download-artifact@v8
        with:
          name: debug-apk-unverified
          path: apk

      - name: Name the APK after the commit
        run: |
          mkdir -p out
          cp apk/app-debug.apk "out/afnopadd-debug-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: afnopadd-debug-apk
          path: out/*.apk
          retention-days: 30

      # One pre-release per commit on main, tagged build-<sha>, so every build stays installable.
      # It is a pre-release because the APK carries the debug key; signed releases come with Task 31.
      - name: Publish a GitHub release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::7}"
          gh release create "build-${short}" out/*.apk \
            --target "$GITHUB_SHA" \
            --title "Build ${short}" \
            --notes "Debug build of ${GITHUB_SHA} from main, after unit, Lint and instrumented tests passed. Signed with the debug key, for testing only." \
            --prerelease
