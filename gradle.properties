# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Speeds up repeated builds by caching the task graph.
org.gradle.configuration-cache=true

# Required for AndroidX dependencies.
android.useAndroidX=true

# Use the official Kotlin code style.
kotlin.code.style=official

# Each module's R class only contains its own resources.
android.nonTransitiveRClass=true
