# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Speeds up repeated builds by caching the task graph.
org.gradle.configuration-cache=true

# Reuses task outputs from earlier builds; CI keeps the cache between runs (setup-gradle).
org.gradle.caching=true

# Required for AndroidX dependencies.
android.useAndroidX=true

# Use the official Kotlin code style.
kotlin.code.style=official

# Each module's R class only contains its own resources.
android.nonTransitiveRClass=true
